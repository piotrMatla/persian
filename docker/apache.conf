# eWnioski
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# konfiguracja, biblioteki i skrypty z crona nie są dostępne z przeglądarki
<DirectoryMatch "^/var/www/html/(conf|vendor|skrypty|docker)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(composer\.(json|lock)|Dockerfile|docker-compose\.yml|\.env.*|README\.md)$">
    Require all denied
</FilesMatch>

# dotychczasowe adresy (http://serwer/eWnioski/php/...) dalej działają
Alias /eWnioski /var/www/html
