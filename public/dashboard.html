<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eWnioski — pulpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --border: #e7e9ec;
    --text: #1a1a1a;
    --sub-text: #8a8f96;
    --input-bg: #f8f9fa;
    --admin-accent: #3B5B76;
    --admin-bg: #eaf0f4;
    --prod-accent: #C2410C;
    --prod-bg: #fbe9e0;
    --red: #E4032E;
}

html.dark {
    --bg: #101114;
    --card-bg: #1a1b1f;
    --border: #2c2e34;
    --text: #f2f3f5;
    --sub-text: #8b909a;
    --input-bg: #1a1b1f;
    --admin-bg: rgba(59, 91, 118, .28);
    --prod-bg: rgba(194, 65, 12, .22);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
}

.app-shell {
    display: flex;
    min-height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 240px;
    flex: none;
    background: var(--card-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    overflow-y: auto;
    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 4px 24px;
}

.brand-name {
    font-weight: 800;
    font-size: 16px;
    color: var(--text);
    letter-spacing: -.2px;
}

.search-box {
    position: relative;
    margin-bottom: 18px;
}

.search-box svg {
    position: absolute;
    left: 11px;
    top: 10px;
    color: var(--sub-text);
    pointer-events: none;
}

.search-box input {
    width: 100%;
    padding: 9px 10px 9px 32px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--text);
    background: var(--input-bg);
    outline: none;
}

.field-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--sub-text);
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 0 6px 8px;
    margin-top: 6px;
}

.site-select {
    width: 100%;
    margin-bottom: 8px;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 12.5px;
    font-family: inherit;
}

.category-nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.tab-btn {
    all: unset;
    cursor: pointer;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--sub-text);
}

.tab-btn:hover { opacity: .85; }

.tab-btn.active[data-category="admin"] { background: var(--admin-bg); color: var(--admin-accent); }
.tab-btn.active[data-category="prod"]  { background: var(--prod-bg);  color: var(--prod-accent); }
.tab-btn.active[data-category="all"]   { background: var(--border);   color: var(--text); }

.sidebar-footer {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--sub-text);
}

.toggle {
    all: unset;
    cursor: pointer;
    width: 36px;
    height: 20px;
    border-radius: 10px;
    background: #d6d9dd;
    position: relative;
}

.toggle[aria-pressed="true"] { background: var(--red); }

.toggle-knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
    transition: left .15s;
}

.toggle[aria-pressed="true"] .toggle-knob { left: 18px; }

.admin-link {
    display: block;
    text-align: center;
    margin-top: 12px;
    padding: 8px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--sub-text);
    text-decoration: none;
}

.admin-link:hover { color: var(--text); }

/* Main content */
.content {
    flex: 1;
    margin-left: 240px;
    padding: 24px 32px 60px;
    min-width: 0;
}

.favorites-row { margin-bottom: 20px; }

.section-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--sub-text);
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 10px;
}

.favorites-track {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
}

.fav-chip {
    all: unset;
    cursor: pointer;
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 9px 12px;
    min-width: 150px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
}

.content-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
}

.content-header h1 { font-size: 20px; font-weight: 800; margin: 0; }

.results-count { font-size: 12.5px; color: var(--sub-text); }

.app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
}

.app-card {
    position: relative;
    z-index: 1;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform .15s, box-shadow .15s, border-color .15s;
    text-decoration: none;
    color: inherit;
}

.app-card:hover {
    transform: translateY(-2px);
    border-color: var(--red);
    box-shadow: 0 10px 24px rgba(228, 3, 46, .16);
    z-index: 20;
}

.app-hover-info {
    position: absolute;
    top: 100%;
    left: -8px;
    right: -8px;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 12px 14px;
    background: var(--red);
    border-radius: 12px;
    box-shadow: 0 14px 30px rgba(228, 3, 46, .35);
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity .15s ease, transform .15s ease;
    pointer-events: none;
}

.app-card:hover .app-hover-info {
    opacity: 1;
    transform: translateY(0);
}

.hover-info-title {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 2px;
}

.hover-info-row {
    font-size: 11.5px;
    line-height: 1.4;
    color: rgba(255, 255, 255, .95);
}

.hover-info-row .hover-info-label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: rgba(255, 255, 255, .7);
}

.fav-star {
    all: unset;
    cursor: pointer;
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;
    color: #c7cbd1;
    display: flex;
}

html.dark .fav-star { color: #565a63; }
.fav-star.is-fav { color: var(--red); }
.fav-star.is-fav svg { fill: var(--red); }
.fav-star:hover { transform: scale(1.15); }

.app-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.app-card[data-category="admin"] .app-icon { background: var(--admin-bg); color: var(--admin-accent); }
.app-card[data-category="prod"]  .app-icon { background: var(--prod-bg);  color: var(--prod-accent); }

.app-name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
}

.app-purpose {
    font-size: 11.5px;
    color: var(--sub-text);
    line-height: 1.4;
}

.app-meta {
    margin-top: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}

.badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 6px;
    background: var(--input-bg);
    color: var(--sub-text);
    border: 1px solid var(--border);
}

.empty-state {
    text-align: center;
    color: var(--sub-text);
    padding: 60px 0;
    font-size: 13px;
}

/* Modal for multi-link apps */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modal-overlay[hidden] {
    display: none;
}

.modal {
    background: var(--card-bg);
    border-radius: 14px;
    width: min(480px, 90vw);
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.modal-header h2 { font-size: 16px; margin: 0; }

.modal-header button {
    all: unset;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    color: var(--sub-text);
}

.modal-links {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.modal-links a {
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
}

.modal-links a:hover { background: var(--border); }

@media (max-width: 720px) {
    .app-shell { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; }
    .content { padding: 20px; margin-left: 0; }
}
</style>
</head>

</div>

</div>

    swap:    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg>',
    book:    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M4 5v14M8 7h7M8 11h7"/></svg>',
    folder:  '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',

};

// --- Moduły eWniosków (warstwa 4A: nowa skóra, istniejące endpointy) ---
const APPS = [
    { id: 'urlop', name: 'Wniosek o urlop', category: 'prod', icon: 'leave',
      purpose: 'Wpisanie wniosku urlopowego (wypoczynkowy, na dziecko, zwolnienie).',

    { id: 'zdalna', name: 'Praca zdalna', category: 'prod', icon: 'home',

    { id: 'zdalna-start', name: 'Rozpocznij / zakończ pracę zdalną', category: 'prod', icon: 'swap',

      href: 'modyfikuj.php?rozpocznij_zdalna', badges: ['Akcja'],

    { id: 'nadgodziny', name: 'Rozliczenie nadgodzin', category: 'prod', icon: 'clock',

    { id: 'wczytaj-urlop', name: 'Wczytaj liczbę urlopu', category: 'admin', icon: 'upload',

      info: { 'Dostęp': 'Tylko HR', 'Format': 'XLSX' } },

const CATEGORY_TITLE = { all: 'Wszystkie moduły', prod: 'Produkcja / pracownik', admin: 'Administracja / HR' };

// --- Stan ---
const FAV_KEY = 'ewnioski_favorites';
let favorites = loadFavorites();
let activeCategory = 'all';
let searchTerm = '';

function loadFavorites() {
    try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); }
    catch { return new Set(); }
}
function saveFavorites() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); } catch {}
}

// --- Render ---
const grid = document.getElementById('app-grid');
const emptyState = document.getElementById('empty-state');
const resultsCount = document.getElementById('results-count');
const heading = document.getElementById('heading');
const favRow = document.getElementById('favorites-row');
const favTrack = document.getElementById('favorites-track');

function matches(app) {
    const catOk = activeCategory === 'all' || app.category === activeCategory;
    const term = searchTerm.trim().toLowerCase();
    const searchOk = term === '' ||
        app.name.toLowerCase().includes(term) ||
        app.purpose.toLowerCase().includes(term);
    return catOk && searchOk;
}

function cardHtml(app) {
    const isFav = favorites.has(app.id);
    const infoRows = Object.entries(app.info || {}).map(([k, v]) =>
        `<div class="hover-info-row"><span class="hover-info-label">${esc(k)}</span>${esc(v)}</div>`).join('');
    const badges = (app.badges || []).map(b => `<span class="badge">${esc(b)}</span>`).join('');
    const tag = app.links ? 'div' : 'a';
    const hrefAttr = app.links ? '' : `href="${esc(app.href)}"`;
    return `
    <${tag} class="app-card" data-category="${app.category}" data-id="${app.id}" ${hrefAttr}>
        <button class="fav-star ${isFav ? 'is-fav' : ''}" data-fav="${app.id}" aria-label="Ulubione">${ICON.star}</button>
        <div class="app-icon">${ICON[app.icon] || ICON.folder}</div>
        <div class="app-name">${esc(app.name)}</div>
        <div class="app-purpose">${esc(app.purpose)}</div>
        <div class="app-meta">${badges}</div>
        <div class="app-hover-info">
            <div class="hover-info-title">${esc(app.name)}</div>
            ${infoRows}
            ${app.links ? `<div class="hover-info-row">${app.links.length} raportów — kliknij, by wybrać</div>` : ''}
        </div>
    </${tag}>`;
}

function render() {
    const visible = APPS.filter(matches);
    grid.innerHTML = visible.map(cardHtml).join('');
    emptyState.hidden = visible.length > 0;
    resultsCount.textContent = `${visible.length} ${plural(visible.length)}`;
    heading.textContent = searchTerm.trim() ? 'Wyniki wyszukiwania' : CATEGORY_TITLE[activeCategory];
    renderFavorites();
}

function renderFavorites() {
    const favApps = APPS.filter(a => favorites.has(a.id));
    favRow.hidden = favApps.length === 0;
    favTrack.innerHTML = favApps.map(a =>
        `<button class="fav-chip" data-id="${a.id}">${ICON[a.icon] || ICON.folder}<span>${esc(a.name)}</span></button>`).join('');
}

function plural(n) {
    if (n === 1) return 'moduł';
    if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return 'moduły';
    return 'modułów';
}

function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// --- Zdarzenia ---
document.getElementById('search').addEventListener('input', e => { searchTerm = e.target.value; render(); });

document.getElementById('category-nav').addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    activeCategory = btn.dataset.category;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    render();
});

grid.addEventListener('click', e => {
    const favBtn = e.target.closest('[data-fav]');
    if (favBtn) {
        e.preventDefault();
        const id = favBtn.dataset.fav;
        favorites.has(id) ? favorites.delete(id) : favorites.add(id);
        saveFavorites();
        render();
        return;
    }
    const card = e.target.closest('.app-card');
    if (card && !card.getAttribute('href')) {
        const app = APPS.find(a => a.id === card.dataset.id);
        if (app && app.links) openModal(app);
    }
});

favTrack.addEventListener('click', e => {
    const chip = e.target.closest('.fav-chip');
    if (!chip) return;
    const app = APPS.find(a => a.id === chip.dataset.id);
    if (!app) return;
    if (app.links) openModal(app);
    else window.location.href = app.href;
});

// --- Modal ---
const modal = document.getElementById('modal');
function openModal(app) {
    document.getElementById('modal-title').textContent = app.name;
    document.getElementById('modal-links').innerHTML =
        app.links.map(l => `<a href="${esc(l.href)}">${esc(l.label)}</a>`).join('');
    modal.hidden = false;
}
function closeModal() { modal.hidden = true; }
document.getElementById('modal-close').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// --- Tryb ciemny ---
const THEME_KEY = 'ewnioski_theme';
const themeToggle = document.getElementById('theme-toggle');
function applyTheme(dark) {
    document.documentElement.classList.toggle('dark', dark);
    themeToggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
}
try {
    const stored = localStorage.getItem(THEME_KEY);
    applyTheme(stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
} catch { applyTheme(false); }
themeToggle.addEventListener('click', () => {
    const dark = !document.documentElement.classList.contains('dark');
    applyTheme(dark);
    try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch {}
});

render();
</script>
</body>
</html>
