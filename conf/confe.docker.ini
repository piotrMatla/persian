; Odpowiednik confe.ini dla kontenera Docker (wskazany zmienną EWNIOSKI_INI).
; Foldery leżą w wolumenie /var/lib/ewnioski, adresy mailowe pochodzą ze zmiennych środowiskowych (.env).
[Mail Programista]
MailProgramista = "${EWNIOSKI_MAIL_PROGRAMISTA}"
[Foldery]
FolderLogs = "/var/lib/ewnioski/logs/"
FolderTMP = "/var/lib/ewnioski/tmp/"
UzupelnienieDanych = "${EWNIOSKI_UZUPELNIENIE_DANYCH}"
MailNowyWniosek = "${EWNIOSKI_MAIL_NOWY_WNIOSEK}"
FolderPlikow = "/var/lib/ewnioski/pliki"
FolderPlikowKierownicy = "/var/lib/ewnioski/pliki_kierownicy"
